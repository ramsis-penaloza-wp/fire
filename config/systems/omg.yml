# Order Management Gateway (order-management-gateway).
# Decisions only; OMG's events, processors, and ingress are discovered from its manifest.
# Contract: docs/specs/system-config-and-discovery.md
system: omg
display_name: Order Management Gateway

notify:
  slack:
    # Placeholder, not a real channel. OMG's channel id is still an open question in
    # docs/specs/ingest-drift-and-feedback.md; replace it before the Slack notifier ships.
    channel_id: C0000000000

# OMG commits its event graph at scripts/event_chains/event_chains_graph.json
# (regenerated with `make event-chains/generate`).
discovery:
  manifest:
    kind: event_chains_graph
    path_env: OMG_MANIFEST_PATH

# Where the tentacle reads. Contract: docs/specs/tentacle.md#sources-in-the-system-yaml.
# `replay`, `http_proxy`, and `otlp` run so far; the tentacle skips the others and says so.
sources:
  # Spans from OMG's OpenTelemetry collector, which dev/omg/ gives one more exporter, to
  # host.docker.internal:4318. Contract: docs/specs/http-and-span-capture.md#otlp-receiver.
  - {id: omg-traces, kind: otlp, listen_env: OMG_OTLP_LISTEN}
  # Inbound HTTP: post to the proxy port instead of the service's. Route templates come from
  # each upstream's /openapi.json. Contract: docs/specs/http-and-span-capture.md#inbound-proxy.
  # Upstream port + 100. Not 8021: macOS's launchd can hold localhost:8021 for its ftp-proxy.
  - {id: omg-api, kind: http_proxy, listen_port: 8120, upstream_env: OMG_API_UPSTREAM}
  - {id: omg-validation, kind: http_proxy, listen_port: 8130,
     upstream_env: OMG_VALIDATION_UPSTREAM}
  # DomainEvents. kinesis-publisher runs in every region, so one `id` (the work unit's
  # work_unit_id) arrives from both streams and counts once.
  - id: domain-events
    kind: kinesis
    direction: internal
    stream_env: OMG_EVENTS_STREAM
    regions: [us-east-1, us-west-2]
    envelope: {event_id: id, event_type: eventType, occurred_at: occurredAt, work_id: id,
               payload: payload}
  # Every domain event, including the 39 that never reach Kinesis. SK is EVENT#<work_unit_id>.
  - id: order-domain-events
    kind: dynamodb_stream
    direction: internal
    table_env: OMG_EVENTS_TABLE
    regions: [us-east-1, us-west-2]
    envelope: {event_id: {path: SK, strip_prefix: "EVENT#"}, event_type: event_type,
               occurred_at: created_at, work_id: {path: SK, strip_prefix: "EVENT#"},
               payload: payload}
  - id: rx-updates
    kind: kinesis
    direction: inbound
    stream_env: OMG_RX_UPDATES_STREAM
    regions: [us-east-1, us-west-2]     # to be confirmed
    envelope: {event_id: eventId, event_type: eventName, occurred_at: {path: ts, epoch: ms},
               payload: data}
  - id: carrier-events
    kind: sns_fanout
    direction: inbound
    topic_env: OMG_CARRIER_EVENTS_TOPIC
    regions: [us-east-1, us-west-2]     # to be confirmed
    envelope: {event_id: MessageId, event_type: Message.event_type,
               occurred_at: Message.occurred_at, payload: Message}
  - id: financials-events
    kind: sns_fanout
    direction: inbound
    topic_env: OMG_FINANCIALS_EVENTS_TOPIC
    regions: [us-east-1, us-west-2]     # to be confirmed
    envelope: {event_id: MessageId, event_type: Message.event_type,
               occurred_at: Message.published_at, payload: Message}
  # Request and response pairs OMG's partner clients write to its transmission bucket.
  - id: transmissions
    kind: s3_capture
    bucket_env: OMG_TRANSMISSION_BUCKET
    captures:
      - {prefix: narvar-payloads/, label: narvar, layout: work_unit_action}
      - {prefix: insurance-payloads/, label: insurance, layout: work_unit_action}
      - {prefix: monocle-payloads/, label: monocle, layout: work_unit_action}
      - {prefix: notification-payloads/, label: notification, layout: work_unit_action}
      - {prefix: oracle-payloads/, label: oracle-om, layout: work_unit_order_action}
      - {prefix: springfield-payloads/, label: helios, layout: work_unit_order}
      - {prefix: order-services-payloads/, label: order-services, layout: work_unit_order}
  # OMG's WorkUnit samples, scripts/test_payloads/*_work_unit.json. Pointed at the whole
  # directory, the other files there (API request bodies) count as missing_event_id.
  - id: work-unit-samples
    kind: replay
    direction: internal
    path_env: OMG_REPLAY_PATH
    envelope: {event_id: work_unit_id, event_type: event_type,
               occurred_at: metadata.timestamp, work_id: work_unit_id, payload: payload}

# DLQ attribution joins abandoned work units to observations, so every event is fingerprinted.
fingerprinting:
  sample_rate: 1.0

# Baselines and shape drift: docs/specs/ingest-drift-and-feedback.md#baseline.
drift:
  min_samples: 20      # observations folded before a stream is warm and may raise drift
  required_ratio: 1.0  # a field every sample carried is required
