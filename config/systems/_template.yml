# Copy to config/systems/<system>.yml (file name must equal `system`).
# This file holds what a person decides: where to look and which rules apply.
# What the system contains (events, processors, ingress) is discovered, never listed here.
# Contract: docs/specs/system-config-and-discovery.md
system: example
display_name: Example System

notify:
  slack:
    channel_id: C0123456789          # required; public C…, private G…; survives renames
    channel_name: "#example-incidents"  # optional, display only

# Where the system describes itself. Omit `manifest` for observation-only mode.
discovery:
  manifest:
    kind: event_chains_graph         # parser for the manifest format
    path_env: EXAMPLE_MANIFEST_PATH  # env var holding the manifest file path

# Where the tentacle reads. Kinds: replay, kinesis, dynamodb_stream, sns_fanout, s3_capture,
# http_proxy, otlp. Contract: docs/specs/tentacle.md#sources-in-the-system-yaml
sources:
  - id: traces                       # spans from the system's OpenTelemetry collector
    kind: otlp
    listen_env: EXAMPLE_OTLP_LISTEN  # env var holding the listen address, such as 127.0.0.1:4318
  - id: domain-events                # the observations' `source`; unique within the system
    kind: kinesis
    direction: internal              # internal: the system's own events; inbound: external
    stream_env: EXAMPLE_EVENTS_STREAM  # env var holding the stream name
    regions: [us-east-1, us-west-2]
    envelope:                        # dotted paths into each record
      event_id: work_unit_id         # one event read from several regions counts once
      event_type: event_type         # the channel name
      occurred_at: metadata.timestamp  # ISO 8601, or {path: ts, epoch: ms}
      work_id: work_unit_id          # optional; joins events, captures, and outcomes
      payload: payload               # the value generalized into a shape

# How outbound HTTP calls are named. A host not listed keeps its name, and each path segment
# that looks like an id becomes {id}. A listed host takes its alias, and a path matching none
# of its templates becomes {alias}/{unlisted}. Contract:
# docs/specs/http-and-span-capture.md#operation-names
operations:
  http:
    - hosts: ["*.partner.example.com"]  # exact names, or "*." plus a suffix
      alias: partner                    # replaces the host in operation names
      paths:
        - /api/{version}/orders
        - /api/{version}/orders/{order_id}

# Exceptions only. Each name must be declared or observed, or the coverage audit flags it.
policy:
  critical: []                       # events whose drift always matters
  ignore: []                         # known noise, left out of coverage gaps

# Shape fingerprint sampling (no raw values stored).
fingerprinting:
  sample_rate: 0.02

# Baselines and shape drift. Until min_samples observations fold, a stream is
# `baseline rebuilding` and raises no drift.
drift:
  min_samples: 20                    # observations folded before a stream is warm
  required_ratio: 1.0                # share of samples that makes a field required, in (0, 1]
