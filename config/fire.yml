# Global FIRE ENGINE config. Secrets via env refs, never inline.
api:
  token_env: FIRE_API_TOKEN

reasoner:
  provider: echo  # echo | laya | jev
  # base_url_env: FIRE_SYSTEMONE_BASE_URL
  # api_key_env: FIRE_SYSTEMONE_API_KEY

narrator:
